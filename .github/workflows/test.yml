name: test

# The heavy part of this workflow is PyTorch, so the CPU-only wheel index is
# used: it is a fraction of the size of the default CUDA build and the smoke
# test does not need a GPU.
# (このワークフローで重いのは PyTorch のため、CPU 専用の wheel を使う。
#  既定の CUDA 版より遥かに小さく、スモークテストに GPU は不要)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Pinned to the versions in uv.lock. Without a pin, CI installs the
      # newest release and reports findings that a local run does not, which
      # is how a lint job goes red on a commit that passed locally.
      # (uv.lock と同じ版に固定する。固定しないと CI は最新版を入れ、
      #  ローカルでは出ない指摘で lint が赤くなる)
      - run: python -m pip install 'ruff==0.16.8'
      - run: ruff check .
      # mypy needs the dependencies installed to resolve torch and lpu; it
      # reported them as missing stubs once the annotated modules started
      # importing them.
      # (mypy が torch と lpu を解決するには依存の導入が必要。注釈済み
      #  モジュールがそれらを import した途端、stub 欠落として報告された)
      - name: Install with the CPU-only PyTorch build
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . 'mypy==2.3.1'
      # mypy checks only the modules listed in [tool.mypy]; the ported code
      # is not annotated yet, so the list grows as annotations land.
      # (mypy は [tool.mypy] の files に列挙したモジュールのみ検査する。
      #  移植コードは未注釈のため、注釈を付けた分だけ対象を増やしていく)
      - run: mypy

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the CPU-only PyTorch build
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[serve]' pytest
      - run: python -m pytest tests -v
      - name: Every command answers --help
        run: |
          lpu-nn-train-seq2seq --help > /dev/null
          lpu-nn-run-seq2seq --help > /dev/null
          lpu-nn-train-match-ranker --help > /dev/null
          lpu-nn-run-match-ranker --help > /dev/null
          lpu-nn-train-bert --help > /dev/null
          lpu-nn-train-bert-classifier --help > /dev/null
          lpu-nn-run-bert-classifier --help > /dev/null
          lpu-nn-train-bert-ranker --help > /dev/null
          lpu-nn-run-bert-ranker --help > /dev/null
          lpu-nn-train-tagger --help > /dev/null
          lpu-nn-train-embedding --help > /dev/null
          lpu-nn-run-tokenizer --help > /dev/null
          lpu-nn-serve-seq2seq --help > /dev/null

  smoke:
    name: train and decode (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install with the CPU-only PyTorch build
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      # A whole epoch on a 200-sentence synthetic corpus, then decoding with
      # the checkpoint it wrote. This is what catches a dependency that
      # changed under us, which is how most of the ported defects surfaced.
      # (200 文の人工コーパスで 1 エポック回し、書き出されたチェックポイントで
      #  復号する。依存側の破壊的変更を捉えるのが狙いで、移植時の不具合の
      #  多くはこの経路で表面化した)
      - name: Train for one epoch
        run: |
          python -m lpu_nn.commands.train_seq2seq runs/ci tests/data/train.tsv \
            --dev-files tests/data/dev.tsv \
            --num-epochs 1 --batch-size 16 --vocab-size 100 \
            --embed-size 32 --hidden-size 32 --num-heads 4 --gpu -1 \
            --logging runs/ci-train.log
      - name: The best checkpoint exists and decodes
        run: |
          test -f runs/ci/record.best_dev_loss/model.pt
          cut -f1 tests/data/dev.tsv | head -5 \
            | python -m lpu_nn.commands.run_seq2seq runs/ci/record.best_dev_loss
      # The same end-to-end pass for the match ranker. Its corpus is the
      # seq2seq one turned into positive/negative pairs, so the two smoke
      # tests share their data and stay cheap.
      # (マッチングランカーも同じ経路で通す。コーパスは seq2seq のものを
      #  正例・負例のペアに組み替えたもので、データを共有して軽く保つ)
      - name: Train the match ranker for one epoch
        run: |
          python -m lpu_nn.commands.train_match_ranker runs/ci-match \
            tests/data/match-train.tsv \
            --dev-files tests/data/match-dev.tsv \
            --num-epochs 1 --batch-size 16 --vocab-size 100 \
            --embed-size 32 --hidden-size 32 --gpu -1 \
            --logging runs/ci-match-train.log
      - name: The best ranker checkpoint exists and scores
        run: |
          test -f runs/ci-match/record.best_dev_mrr/model.pt
          python -m lpu_nn.commands.run_match_ranker \
            runs/ci-match/record.best_dev_mrr \
            --evaluate tests/data/match-dev.tsv
      # BERT: pre-train for one epoch, then fine-tune the classifier from
      # that checkpoint and classify with the result. The fine-tuning step
      # is what proves the pre-trained weights actually transfer.
      # (BERT は 1 エポック事前学習し、そのチェックポイントから分類器を
      #  ファインチューニングして分類まで通す。事前学習の重みが実際に
      #  効いていることを確かめるのがファインチューニング手順の狙い)
      - name: Pre-train BERT for one epoch
        run: |
          python -m lpu_nn.commands.train_bert runs/ci-bert tests/data/train.tsv \
            --dev-files tests/data/dev.tsv \
            --num-epochs 1 --batch-size 8 --vocab-size 100 \
            --embed-size 32 --hidden-size 32 --num-heads 4 --gpu -1 \
            --logging runs/ci-bert.log
      - name: Fine-tune a classifier and classify with it
        run: |
          test -f runs/ci-bert/record.best_dev_loss/model.pt
          python -m lpu_nn.commands.train_bert_classifier runs/ci-bert-cls \
            tests/data/class-train.tsv \
            --dev-files tests/data/class-dev.tsv \
            --num-epochs 1 --batch-size 8 --vocab-size 100 \
            --embed-size 32 --hidden-size 32 --num-heads 4 --gpu -1 \
            --pre-trained-model runs/ci-bert/record.best_dev_loss \
            --sentencepiece runs/ci-bert/sp.model \
            --logging runs/ci-bert-cls.log
          cut -f1 tests/data/class-dev.tsv | head -5 \
            | python -m lpu_nn.commands.run_bert_classifier \
                runs/ci-bert-cls/record.best_dev_acc
      # Sequence tagging, over the encoder that is not exercised above:
      # a BiLSTM with a CRF decoder. The corpus is the seq2seq one turned
      # into BIO tags.
      # (系列タギング。上で通っていない符号化器 (BiLSTM) と CRF 復号器を
      #  通す。コーパスは seq2seq のものを BIO タグに組み替えたもの)
      - name: Train the tagger for one epoch
        run: |
          python -m lpu_nn.commands.train_tagger runs/ci-tag \
            tests/data/tag-train.tsv \
            --dev-files tests/data/tag-dev.tsv \
            --num-epochs 1 --batch-size 8 --vocab-size 100 \
            --embed-size 32 --hidden-size 32 --gpu -1 \
            --encoder-type lstm --decoder-type crf \
            --logging runs/ci-tag.log
      - name: The tagger wrote its predictions
        run: |
          test -f runs/ci-tag/record.best_dev_f1/model.pt
          test -s runs/ci-tag/record.latest/pred_dev.txt
      # The character language model, and the tokenizer command applied to
      # the vocabulary it trained.
      # (文字言語モデルと、それが学習した語彙を使うトークナイザコマンド)
      - name: Train the language model for one epoch
        run: |
          mkdir -p runs
          cut -f1 tests/data/train.tsv > runs/lm-train.txt
          cut -f1 tests/data/dev.tsv > runs/lm-dev.txt
          python -m lpu_nn.commands.train_embedding runs/ci-lm \
            runs/lm-train.txt --dev-files runs/lm-dev.txt \
            --num-epochs 1 --batch-size 8 --vocab-size 100 \
            --embed-size 32 --hidden-size 32 --gpu -1 \
            --logging runs/ci-lm.log
      - name: The tokenizer applies the vocabulary it trained
        run: |
          test -f runs/ci-lm/record.best_dev_loss/model.pt
          cut -f1 tests/data/dev.tsv | head -5 \
            | python -m lpu_nn.commands.run_tokenizer runs/ci-lm/sp.model
      - name: Nothing was written into the working directory
        run: |
          test ! -e TMP.txt
          git diff --exit-code --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: training-log
          path: |
            runs/ci-train.log
            runs/ci-match-train.log
            runs/ci-bert.log
            runs/ci-bert-cls.log
            runs/ci-tag.log
            runs/ci-lm.log
          if-no-files-found: warn
