name: release

# Pushing a tag such as v0.1.0 builds the distributions and publishes them.
# (v0.1.0 のようなタグを push すると配布物をビルドして公開する)
#
# Unlike lpu, this package is pure Python, so one wheel covers every platform
# and no cibuildwheel matrix is needed.
# (lpu と異なり本パッケージは純 Python のため、wheel は 1 つで全ての環境を
#  賄えるので cibuildwheel のマトリクスは不要)
on:
  push:
    tags:
      - 'v*'
  # Allows a dry run that builds everything without publishing.
  # (公開せずにビルドだけ試すための手動実行)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check the tag against lpu_nn/VERSION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compare the tag with lpu_nn/VERSION
        run: |
          set -eu
          version="$(cat lpu_nn/VERSION)"
          echo "lpu_nn/VERSION: ${version}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag build; skipping the comparison."
            exit 0
          fi
          echo "tag: ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match lpu_nn/VERSION (${version})"
            exit 1
          fi

  build:
    name: Build the distributions
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify that the sdist installs and passes the tests
        run: |
          set -eu
          python -m venv "${RUNNER_TEMP}/sdist-check"
          # The CPU-only wheel keeps this step a fraction of the size of the
          # default CUDA build, and the tests do not need a GPU.
          # (CPU 専用の wheel で軽く済ませる。テストに GPU は不要)
          "${RUNNER_TEMP}/sdist-check/bin/python" -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          # The "name[extra] @ file://" form is the reliable way to request
          # extras for a local archive.
          # (ローカルの配布物にエクストラを指定する確実な書式を使う)
          sdist="$(ls dist/*.tar.gz)"
          "${RUNNER_TEMP}/sdist-check/bin/python" -m pip install \
            "lpu-nn[plot,serve] @ file://${PWD}/${sdist}" pytest
          # Run from outside the checkout so the tests import the installed
          # distribution rather than the source tree next to them.
          # (チェックアウト外から実行し、隣のソースツリーではなく
          #  インストール済みの配布物を import させる)
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/sdist-check/bin/python" -m pytest "${GITHUB_WORKSPACE}/tests"
      - name: The wheel carries the server template
        run: |
          set -eu
          wheel="$(ls dist/*.whl)"
          python -m zipfile --list "${wheel}" \
            | grep -q 'lpu_nn/server_static/seq2seq.html'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    # Never publish from a manual dry run. (手動実行では公開しない)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/lpu-nn
    permissions:
      # Required for Trusted Publishing. (Trusted Publishing に必要)
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: List the distributions
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for the details of this release."
