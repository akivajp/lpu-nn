[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lpu-nn"
dynamic = ["version"]
description = "Neural language processing models on PyTorch, built on LPU"
readme = "README.md"
# torch 2.4 以降がサポートする下限に合わせる (lpu 本体と同じ下限)
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [
    { name = "Akiva Miura", email = "akiva.miura@gmail.com" },
]
keywords = [
    "NLP",
    "PyTorch",
    "deep learning",
    "natural language processing",
    "sequence to sequence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# lpu provides the configuration, logging, progress and file utilities that
# this package builds on; the rest is the neural stack itself.
# lpu が設定・ロギング・進捗表示・ファイル操作の基盤を提供し、
# 残りがニューラル部分そのものの依存となる。
dependencies = [
    # This needs IDMap and the safe_* file helpers, which land in the release
    # after lpu 0.5.2. Until that release is on PyPI the requirement has to
    # name the repository: a version constraint alone resolves to 0.5.2 and
    # the import fails at startup. Replace this with "lpu>=0.6" once the
    # release is published, which is also what makes lpu-nn publishable
    # (PyPI rejects direct URL dependencies).
    # (IDMap と safe_* 系のファイル補助が必要で、これらは lpu 0.5.2 の次の
    #  リリースに入る。そのリリースが PyPI に出るまではリポジトリを直接
    #  指定する必要がある。バージョン指定だけでは 0.5.2 が解決され、起動
    #  直後に import が失敗するため。公開後は "lpu>=0.6" に置き換える。
    #  PyPI は直接 URL 依存を受け付けないため、この置き換えが lpu-nn を
    #  公開可能にする条件でもある)
    "lpu @ git+https://github.com/akivajp/lpu.git@master",
    "torch>=2.4",
    "sentencepiece>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    # corpus-level BLEU during seq2seq evaluation
    # (seq2seq の評価で使うコーパス単位 BLEU)
    "nltk>=3.8",
]

[project.optional-dependencies]
# Training curves are written only when matplotlib is available; the trainer
# skips the plot otherwise.
# (訓練曲線の出力は matplotlib がある場合のみ行い、無ければ描画を省略する)
plot = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/akivajp/lpu-nn"
Repository = "https://github.com/akivajp/lpu-nn"
Issues = "https://github.com/akivajp/lpu-nn/issues"

[project.scripts]
lpu-nn-train-seq2seq = "lpu_nn.commands.train_seq2seq:main"
lpu-nn-run-seq2seq = "lpu_nn.commands.run_seq2seq:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.13",
    "mypy>=1.11",
]

[tool.ruff.lint]
# Mirrors the lpu configuration: only rules that catch real defects, because
# the ported code keeps its original naming.
# (lpu の設定に合わせ、実害を捉えるルールのみ。移植コードは元の命名を保つため
#  スタイル系は対象外とする)
select = [
    "B",    # bugbear
    "C4",   # flake8-comprehensions
    "E722", # bare except
    "E9",   # runtime / syntax errors
    "F",    # pyflakes
    "RUF",  # ruff-specific
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# The comments in tokenizer.py deliberately list Cyrillic and Greek sample
# characters next to the script names they belong to, so the ambiguous
# character check (RUF003) misfires on them.
# (tokenizer.py のコメントは、対応する文字種名の隣にキリル文字・ギリシャ
#  文字の例を意図的に並べているため、曖昧文字の検査が誤検出する)
"lpu_nn/common/tokenizer.py" = ["RUF003"]

[tool.mypy]
# Gradual adoption, as in lpu: only the modules annotated so far are checked.
# New modules are added here as their annotations land.
# (lpu と同様に段階的導入。注釈済みモジュールのみを検査対象とし、
#  注釈を付けたものからここに追加していく)
# The ported code is not annotated yet; these two modules were written for
# this package and are, so they hold the baseline. Add each ported module
# here as its annotations land.
# (移植コードは未注釈。この 2 つは本パッケージ用に書き下ろしたもので注釈
#  済みのため、ここを起点とする。移植分は注釈を付けた順に追加していく)
files = [
    "lpu_nn/common/args.py",
    "lpu_nn/common/criteria.py",
    "lpu_nn/common/dataset.py",
    "lpu_nn/common/files.py",
    "lpu_nn/common/utils.py",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

# torch ships type information; these do not. pandas publishes its stubs
# separately (pandas-stubs), which would be a checking project of its own,
# so the missing stubs are accepted for now.
# (torch は型情報を同梱するが、以下は同梱しない。pandas のスタブは
#  pandas-stubs として別配布であり、その導入は別途の検査作業になるため、
#  現時点ではスタブ欠落を許容する)
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "sentencepiece", "nltk.*"]
ignore_missing_imports = true

[tool.setuptools.dynamic]
version = { file = "lpu_nn/VERSION" }

[tool.setuptools.packages.find]
include = ["lpu_nn*"]

[tool.setuptools.package-data]
lpu_nn = ["VERSION", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lpu_nn"]
parallel = true

[tool.coverage.report]
sort = "cover"
